<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile /etc/grid-security/hostcert.pem
    SSLCertificateKeyFile /etc/grid-security/hostkey.pem
    SSLCACertificatePath /etc/grid-security/certificates
    SSLCARevocationPath /etc/grid-security/certificates
    # SSLCertificateFile      /etc/apache2/ssl/server.crt
    # SSLCertificateKeyFile   /etc/apache2/ssl/server.key

    # # CA that issued client certificates
    # SSLCACertificateFile    /etc/apache2/ssl/ca.crt

    # Require client certificate
    SSLVerifyClient require
    SSLVerifyDepth 2

    # Forward the client certificate to the backend
    RequestHeader set SSL_CLIENT_S_DN "%{SSL_CLIENT_S_DN}s"
    RequestHeader set SSL_CLIENT_I_DN "%{SSL_CLIENT_I_DN}s"
    RequestHeader set SSL_CLIENT_VERIFY "%{SSL_CLIENT_VERIFY}s"
    # RequestHeader set X-Client-Cert "%{SSL_CLIENT_CERT}s"

    # Optional: export certificate details to backend
    SSLOptions +ExportCertData +StdEnvVars

    # Reverse proxy to internal service
    ProxyPreserveHost On
    ProxyPass        / http://webapp:8080/
    ProxyPassReverse / http://webapp:8080/

    # If backend is on host machine instead of Docker network:
    # ProxyPass        / http://host.docker.internal:8080/
    # ProxyPassReverse / http://host.docker.internal:8080/
</VirtualHost>

